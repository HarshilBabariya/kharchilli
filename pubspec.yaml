name: gharcha
description: Gharcha - household expenses with spice. Track, split, budget and get roasted for it.
publish_to: none
version: 1.10.4+25

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.4
  flutter_timezone: 3.0.1
  speech_to_text: ^7.0.0
  share_plus: 10.1.4
  file_picker: ^10.0.0
  audioplayers: ^6.1.0
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  quick_actions: ^1.1.0
  local_auth: 2.3.0
  image_picker: ^1.1.2
  android_intent_plus: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/sfx/
    - assets/brand/icon.png
    - assets/art/badges/
    - assets/art/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
