name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.38.x

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: python3 tool/check_strings.py
      - run: bash tool/bootstrap.sh
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build the installable APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v5
        with:
          name: Kharchili-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Build the Play Store bundle
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > android/key.properties
          flutter build appbundle --release
      - uses: actions/upload-artifact@v5
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: Kharchili-play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: bash tool/bootstrap.sh
      - name: Build for iPhone (unsigned, proves the iOS app compiles)
        run: flutter build ios --release --no-codesign

  site:
    needs: android
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: Kharchili-apk
          path: apk
      - name: Put the APK on the site
        run: |
          mkdir -p website/public/downloads
          mv apk/app-release.apk website/public/downloads/Kharchili.apk
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
        working-directory: website
      - run: npm run build
        working-directory: website
      - name: Check the download made it into the site
        run: test "$(stat -c %s website/dist/downloads/Kharchili.apk)" -gt 1000000
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
      - id: deployment
        uses: actions/deploy-pages@v4
